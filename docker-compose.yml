services:
  iudx-mcp-server:
    build:
      context: .
      dockerfile: Dockerfile
    image: iudx-mcp-server:latest
    container_name: iudx-mcp-server
    ports:
      - "${MCP_PORT:-8000}:8000"
    environment:
      MCP_TRANSPORT: ${MCP_TRANSPORT:-sse}
      MCP_HOST: "0.0.0.0"
      MCP_PORT: "8000"
      IUDX_BASE_URL: ${IUDX_BASE_URL:-https://mahaagx.maharashtra.gov.in/controlplane/}
      RS_BASE_URL: ${RS_BASE_URL:-https://mahaagx.maharashtra.gov.in/dataplane/}
      RSP_BASE_URL: ${RSP_BASE_URL:-https://mahaagx.maharashtra.gov.in/dataplane/rsp/}
      FILES_BASE_URL: ${FILES_BASE_URL:-https://mahaagx.maharashtra.gov.in/files-connect-api/v1/}
      ES_INDEX_PREFIX: ${ES_INDEX_PREFIX:-}
    restart: unless-stopped
    healthcheck:
      test: >-
        python -c
        "import http.client, sys; c=http.client.HTTPConnection('localhost',8000,timeout=4);
        c.request('GET','/sse'); r=c.getresponse(); sys.exit(0 if r.status==200 else 1)"
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
